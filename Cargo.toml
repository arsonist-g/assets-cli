[workspace]
resolver = "2"
members = ["core", "cli"]

# gui 是下一个任务的事，先留占位目录，不进 workspace

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
assets-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
